{% extends 'inventory/base.html' %}

{% block title %}Login — Medical Inventory System{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 py-5">
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card card-custom p-4 shadow-lg border-0">
            <div class="text-center mb-4">
                <div class="bg-primary text-white d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 64px; height: 64px;">
                    <i class="bi bi-hospital fs-2"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">Medical Store Portal</h3>
                <p class="text-muted small">Sign in to access Inventory & Analytics</p>
            </div>

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label font-monospace fw-semibold small text-uppercase">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                        <input type="text" name="username" id="id_username" class="form-control border-start-0" placeholder="Enter username" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="id_password" class="form-label font-monospace fw-semibold small text-uppercase">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" name="password" id="id_password" class="form-control border-start-0" placeholder="Enter password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
